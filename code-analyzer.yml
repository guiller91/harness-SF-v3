# Configuración de Salesforce Code Analyzer v5 para el gate `static`.
# Protegido: los agentes no pueden editar este fichero (relajar una regla es decisión humana).
# Referencia completa:  sf code-analyzer config --rule-selector all --output-file ejemplo.yml
#
# Qué reglas se ejecutan y con qué umbral se decide en harness.config.json:
#   quality.analyzer.ruleSelector       (por defecto: Recommended)
#   quality.analyzer.severityThreshold  (1 crítica … 5 informativa; el gate falla en <= umbral)
#   quality.analyzer.scope              ("changed": solo lo que toca la feature · "all": todo)

ignores:
  files:
    - "**/node_modules/**"
    - "**/staticresources/**"
    - "**/__tests__/**"

rules:
  pmd:
    # Nuestra convención de tests (docs/conventions.md) es `metodo_condicion_resultado`; la regla por
    # defecto de PMD exige camelCase sin guiones bajos y chocaría con todos los tests.
    MethodNamingConventions:
      severity: 4

# El motor `flow` necesita Python 3.10+. Si `sf` no lo encuentra (en Windows suele ser el stub de la
# Store), indica tu Python aquí, o desactiva el motor si el proyecto no usa Flows:
# engines:
#   flow:
#     python_command: "C:/Users/<tu-usuario>/AppData/Local/Programs/Python/Python312/python.exe"
#     # disable_engine: true

# Para endurecer o relajar otra regla concreta, descomenta y ajusta:
#   pmd:
#     ApexCRUDViolation:
#       severity: 1
